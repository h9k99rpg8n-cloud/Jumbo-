<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#062b13" />
<title>Jumbo Launcher</title>
<style>
:root{--bg:#04130a;--bg2:#082817;--green:#0b6b31;--green2:#0f8a3d;--yellow:#ffd51f;--red:#f01919;--text:#fff;--muted:#cfe8d7;--glass:rgba(5,34,17,.74);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,rgba(255,213,31,.18),transparent 28%),radial-gradient(circle at 80% 20%,rgba(240,25,25,.18),transparent 24%),linear-gradient(145deg,#021006 0%,var(--bg2) 52%,#020805 100%)}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,transparent 0 42%,rgba(255,213,31,.14) 43%,rgba(255,213,31,.14) 46%,transparent 47%),linear-gradient(130deg,transparent 0 56%,rgba(240,25,25,.17) 57%,rgba(240,25,25,.17) 60%,transparent 61%);pointer-events:none}.screen{position:fixed;inset:0;display:none;padding:max(16px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}.screen.active{display:flex}.launcher{align-items:center;justify-content:center}.hero{width:min(520px,100%);max-height:100%;overflow:auto;padding:22px;border:1px solid var(--line);border-radius:32px;background:var(--glass);box-shadow:0 30px 90px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.04);backdrop-filter:blur(18px);text-align:center}.logo-wrap{width:min(310px,88vw);margin:0 auto 8px;padding:10px;border-radius:30px;background:rgba(255,255,255,.96);box-shadow:0 20px 55px rgba(0,0,0,.35)}.logo-wrap img{display:block;width:100%;border-radius:22px}.badge{display:inline-flex;gap:7px;align-items:center;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:#eaffef;border:1px solid var(--line);font-size:12px;font-weight:900;letter-spacing:.4px}h1{margin:12px 0 0;font-size:clamp(32px,10vw,58px);line-height:.94;letter-spacing:-1.4px}.slogan{margin:10px auto 18px;color:var(--muted);font-size:16px;max-width:360px}.start{width:100%;padding:15px 16px;border:0;border-radius:20px;font-size:16px;font-weight:1000;color:#05210d;background:linear-gradient(135deg,var(--yellow),#fff06b 50%,#43e06e);box-shadow:0 10px 34px rgba(255,213,31,.28)}.desktop{flex-direction:column;gap:12px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--line);border-radius:22px;background:rgba(1,14,6,.78);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px;font-weight:1000}.brand img{width:48px;height:48px;object-fit:cover;border-radius:15px;background:#fff}.time{color:#dff7e5;font-weight:800;font-size:13px}.ecosystem{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;align-content:start;overflow:auto;padding-bottom:86px}.tile{position:relative;min-height:102px;border:1px solid var(--line);border-radius:24px;padding:14px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:var(--text);text-align:left;overflow:hidden;box-shadow:0 14px 35px rgba(0,0,0,.22)}.tile:after{content:"";position:absolute;right:-22px;bottom:-22px;width:85px;height:85px;border-radius:50%;background:rgba(255,213,31,.12)}.tile b{display:block;font-size:15px;margin-top:8px}.tile small{display:block;margin-top:4px;color:#cfe8d7;line-height:1.25}.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,var(--green2),var(--yellow));color:#051707;font-size:21px;font-weight:1000}.dock{position:fixed;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:24px;background:rgba(1,14,6,.84);backdrop-filter:blur(18px)}.dock button{flex:1;border:0;border-radius:16px;padding:11px;background:rgba(255,255,255,.1);color:#fff;font-weight:900}.window{position:fixed;left:12px;right:12px;bottom:max(82px,calc(env(safe-area-inset-bottom) + 82px));height:min(46vh,390px);transform:translateY(140%);transition:.25s ease;background:rgba(3,18,8,.97);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 80px rgba(0,0,0,.56);overflow:hidden}.window.open{transform:translateY(0)}.whead{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:rgba(255,255,255,.08)}.whead button{border:0;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.12);color:#fff;font-weight:900}.wbody{height:calc(100% - 54px);overflow:auto;padding:15px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,213,31,.14);color:#fff3a6;font-size:12px;font-weight:1000}.panel{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.07)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px;background:rgba(255,255,255,.09);color:#fff;outline:0}option{color:#111}.form{display:grid;gap:10px;margin-top:12px}.primary{border:0;border-radius:16px;padding:13px;font-weight:1000;background:linear-gradient(135deg,var(--yellow),#50e878);color:#051707}@media(min-width:720px){.ecosystem{grid-template-columns:repeat(4,1fr)}.window{left:50%;right:auto;width:min(720px,88vw);transform:translate(-50%,140%)}.window.open{transform:translate(-50%,0)}}
</style>
</head>
<body>
<main id="home" class="screen launcher active"><section class="hero"><div class="logo-wrap"><img src="assets/logo-jumbo.svg" alt="Logo oficial de Jumbo"></div><span class="badge">🚀 JUMBO LAUNCHER · ALPHA 0.1</span><h1>Jumbo</h1><p class="slogan">Tu creación no tiene límites.</p><button class="start" onclick="openLauncher()">Entrar al ecosistema</button></section></main>
<main id="desk" class="screen desktop"><header class="topbar"><div class="brand"><img src="assets/logo-jumbo.svg" alt="Jumbo"><span>Jumbo Launcher</span></div><span id="clock" class="time">--:--</span></header><section class="ecosystem" id="ecosystem"></section><section id="window" class="window" aria-live="polite"><div class="whead"><strong id="wtitle">Jumbo</strong><button onclick="closeWindow()">Cerrar</button></div><div id="wbody" class="wbody"></div></section><nav class="dock"><button onclick="showApp('Nuevo Proyecto')">Nuevo</button><button onclick="showApp('Mis Proyectos')">Proyectos</button><button onclick="showApp('Ajustes')">Ajustes</button></nav></main>
<script>
const $=id=>document.getElementById(id);const state=JSON.parse(localStorage.getItem("jumbo-launcher-state")||'{"projects":[]}');
const apps=[{name:"Nuevo Proyecto",icon:"➕",desc:"Crea juegos 2D, 3D, VR, web, móvil, consola o PC."},{name:"Mis Proyectos",icon:"📁",desc:"Guarda y abre tus mundos dentro de Jumbo."},{name:"Ajustes",icon:"⚙️",desc:"Tema, idioma, rendimiento y perfil del usuario."},{name:"PC Virtual",icon:"🖥️",desc:"Escritorio interno para herramientas y archivos."},{name:"Consola Virtual",icon:"🎮",desc:"Zona para probar juegos como una consola."},{name:"IA Jumbo",icon:"🤖",desc:"Asistente para código, ideas, errores y Código Y."},{name:"Jumbo Studio",icon:"🎬",desc:"Animaciones, cinemáticas, texturas y modelos."},{name:"iOS y Android Unificados",icon:"📱",desc:"Modo experimental para unir experiencias móviles."}];
function save(){localStorage.setItem("jumbo-launcher-state",JSON.stringify(state))}function openLauncher(){$("home").classList.remove("active");$("desk").classList.add("active");renderApps()}function renderApps(){$("ecosystem").innerHTML=apps.map(app=>`<button class="tile" onclick="showApp('${app.name}')"><span class="ico">${app.icon}</span><b>${app.name}</b><small>${app.desc}</small></button>`).join("")}function showApp(name){$("wtitle").textContent=name;$("wbody").innerHTML=appContent(name);$("window").classList.add("open")}function closeWindow(){$("window").classList.remove("open")}
function appContent(name){if(name==="Nuevo Proyecto")return `<span class="tag">Creación</span><div class="panel"><b>Nuevo Proyecto Jumbo</b><p>Configura la base de tu juego o app.</p><div class="form"><input id="projectName" placeholder="Nombre del proyecto"><textarea id="projectDesc" rows="3" placeholder="Descripción"></textarea><select id="projectType"><option>3D</option><option>2D</option><option>VR</option><option>App</option></select><select id="projectDevice"><option>Móvil</option><option>PC</option><option>Web</option><option>Consola</option></select><button class="primary" onclick="createProject()">Crear proyecto</button></div></div>`;if(name==="Mis Proyectos"){const list=state.projects.length?state.projects.map(p=>`<div class="panel"><b>🎮 ${p.name}</b><p>${p.type} · ${p.device}<br>${p.desc||"Sin descripción"}</p></div>`).join(""):`<div class="panel"><b>No hay proyectos todavía</b><p>Crea tu primer proyecto desde Nuevo Proyecto.</p></div>`;return `<span class="tag">Archivos</span>${list}`}if(name==="Ajustes")return `<span class="tag">Sistema</span><div class="panel"><b>Ajustes de Jumbo</b><p>Modo oscuro activo. Próximamente: idioma español/inglés, rendimiento móvil, tema personalizado y perfil.</p></div>`;if(name==="PC Virtual")return `<span class="tag">Módulo futuro</span><div class="panel"><b>PC Virtual Jumbo</b><p>Escritorio con ventanas, archivos, navegador interno y apps del ecosistema.</p></div>`;if(name==="Consola Virtual")return `<span class="tag">Módulo futuro</span><div class="panel"><b>Consola Virtual</b><p>Inicio tipo consola para jugar, probar controles y lanzar proyectos.</p></div>`;if(name==="IA Jumbo")return `<span class="tag">Módulo futuro</span><div class="panel"><b>IA Jumbo</b><p>Chat interno para generar código, explicar errores y construir lógica del ecosistema.</p></div>`;if(name==="Jumbo Studio")return `<span class="tag">Módulo futuro</span><div class="panel"><b>Jumbo Studio</b><p>Creador de cinemáticas, texturas, modelos, animaciones y trailers.</p></div>`;return `<span class="tag">Experimental</span><div class="panel"><b>iOS y Android Unificados</b><p>Esta sección todavía será experimental porque unificar ambos sistemas no es perfecto en web, pero puede servir como panel de compatibilidad.</p></div>`}
function createProject(){const name=$("projectName").value.trim()||"Proyecto sin nombre";const desc=$("projectDesc").value.trim();const type=$("projectType").value;const device=$("projectDevice").value;state.projects.push({name,desc,type,device,createdAt:new Date().toISOString()});save();showApp("Mis Proyectos")}setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})},1000);
</script>
</body>
</html>
