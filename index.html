<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jumbo Ecosistema - Alpha 0.1</title>
  <style>
    :root {
      --bg: #050816;
      --panel: rgba(16, 24, 48, 0.82);
      --panel-2: rgba(25, 38, 74, 0.9);
      --text: #f5f7ff;
      --muted: #9aa8d8;
      --accent: #48d7ff;
      --accent-2: #7c5cff;
      --danger: #ff5c8a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: radial-gradient(circle at top, #14235a, var(--bg) 55%); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
    body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(135deg, rgba(72,215,255,.18), transparent 35%, rgba(124,92,255,.2)); pointer-events: none; }
    .screen { position: fixed; inset: 0; display: none; padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }
    .screen.active { display: flex; }
    .welcome { align-items: center; justify-content: center; text-align: center; }
    .card { width: min(520px, 100%); background: var(--panel); border: 1px solid rgba(255,255,255,.12); border-radius: 28px; padding: 26px; box-shadow: 0 24px 80px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
    .logo { width: 86px; height: 86px; margin: 0 auto 14px; border-radius: 26px; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: #061027; font-weight: 1000; font-size: 42px; box-shadow: 0 0 38px rgba(72,215,255,.45); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(30px, 10vw, 52px); letter-spacing: -1px; }
    h2 { font-size: 22px; }
    p { color: var(--muted); line-height: 1.45; margin-top: 10px; }
    button { border: 0; border-radius: 18px; padding: 14px 16px; color: var(--text); background: var(--panel-2); font-weight: 800; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
    .primary { margin-top: 22px; width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #061027; }
    .desktop { flex-direction: column; gap: 12px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; background: rgba(4,8,22,.72); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 10px 12px; backdrop-filter: blur(14px); }
    .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-top: 8px; }
    .app { min-height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
    .icon { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(72,215,255,.9), rgba(124,92,255,.9)); color: #07101f; font-size: 22px; }
    .window { position: absolute; left: 12px; right: 12px; bottom: 14px; height: min(58vh, 430px); background: rgba(9,16,38,.96); border: 1px solid rgba(255,255,255,.14); border-radius: 24px; overflow: hidden; box-shadow: 0 22px 70px rgba(0,0,0,.55); transform: translateY(110%); transition: transform .28s ease; }
    .window.open { transform: translateY(0); }
    .window-head { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: rgba(255,255,255,.06); }
    .window-body { padding: 14px; height: calc(100% - 52px); overflow: auto; }
    .grid { display: grid; gap: 10px; }
    .mini { text-align: left; padding: 14px; }
    .tag { display: inline-block; padding: 5px 9px; border-radius: 999px; background: rgba(72,215,255,.14); color: var(--accent); font-size: 12px; font-weight: 800; margin-bottom: 8px; }
    @media (max-width: 420px) { .apps { grid-template-columns: repeat(3, 1fr); } .app { min-height: 76px; font-size: 12px; } }
  </style>
</head>
<body>
  <main id="welcome" class="screen welcome active">
    <section class="card">
      <div class="logo">J</div>
      <h1>Jumbo</h1>
      <p>PC Virtual + ecosistema móvil para crear juegos, apps, proyectos y mundos desde iPhone, Android o PC.</p>
      <button class="primary" onclick="goDesktop()">Entrar a Jumbo Alpha 0.1</button>
    </section>
  </main>

  <main id="desktop" class="screen desktop">
    <header class="topbar">
      <strong>🖥️ Jumbo PC Virtual</strong>
      <span id="clock">--:--</span>
    </header>

    <section class="apps">
      <button class="app" onclick="openApp('Archivos', filesHTML())"><span class="icon">📁</span>Archivos</button>
      <button class="app" onclick="openApp('Jumbo Engine', engineHTML())"><span class="icon">🎮</span>Engine</button>
      <button class="app" onclick="openApp('Jumbo Studio', studioHTML())"><span class="icon">🎬</span>Studio</button>
      <button class="app" onclick="openApp('IA Jumbo', iaHTML())"><span class="icon">🤖</span>IA Jumbo</button>
      <button class="app" onclick="openApp('Tienda Jumbo', storeHTML())"><span class="icon">🛒</span>Tienda</button>
      <button class="app" onclick="openApp('Ajustes', settingsHTML())"><span class="icon">⚙️</span>Ajustes</button>
    </section>

    <section id="window" class="window">
      <div class="window-head"><strong id="winTitle">App</strong><button onclick="closeApp()">Cerrar</button></div>
      <div id="winBody" class="window-body"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = JSON.parse(localStorage.getItem('jumbo-alpha-state') || '{"projects":[]}');

    function save() { localStorage.setItem('jumbo-alpha-state', JSON.stringify(state)); }
    function goDesktop() { $('welcome').classList.remove('active'); $('desktop').classList.add('active'); }
    function openApp(title, html) { $('winTitle').textContent = title; $('winBody').innerHTML = html; $('window').classList.add('open'); }
    function closeApp() { $('window').classList.remove('open'); }

    function filesHTML() {
      const projects = state.projects.length ? state.projects.map(p => `<button class="mini">🎮 <b>${p.name}</b><br><small>${p.type} · ${p.platform}</small></button>`).join('') : '<p>Aún no hay proyectos. Crea uno desde Jumbo Engine.</p>';
      return `<span class="tag">Guardado local</span><h2>Mis proyectos</h2><div class="grid">${projects}</div>`;
    }

    function engineHTML() {
      return `<span class="tag">Alpha 0.1</span><h2>Crear proyecto</h2><p>Base del editor. Esto todavía no es el motor 3D completo; es el primer núcleo del ecosistema.</p>
      <div class="grid" style="margin-top:12px">
        <input id="pname" placeholder="Nombre del proyecto" style="padding:14px;border-radius:14px;border:0;background:#121b3a;color:white">
        <select id="ptype" style="padding:14px;border-radius:14px;border:0;background:#121b3a;color:white"><option>3D</option><option>2D</option><option>VR</option></select>
        <select id="pplatform" style="padding:14px;border-radius:14px;border:0;background:#121b3a;color:white"><option>Móvil</option><option>PC</option><option>Web</option><option>Consola</option></select>
        <button class="primary" onclick="createProject()">Crear proyecto</button>
      </div>`;
    }

    function createProject() {
      const name = $('pname').value.trim() || 'Proyecto sin nombre';
      state.projects.push({ name, type: $('ptype').value, platform: $('pplatform').value, createdAt: new Date().toISOString() });
      save();
      openApp('Archivos', filesHTML());
    }

    function studioHTML() { return `<span class="tag">Próxima fase</span><h2>Jumbo Studio</h2><p>Zona para animaciones, cinemáticas, texturas, modelos y videos del ecosistema.</p>`; }
    function iaHTML() { return `<span class="tag">Próxima fase</span><h2>IA Jumbo</h2><p>Asistente interno para generar código, explicar errores y crear lógica del Código Y.</p>`; }
    function storeHTML() { return `<span class="tag">Próxima fase</span><h2>Tienda Jumbo</h2><p>Plantillas, ejemplos, proyectos y herramientas del ecosistema.</p>`; }
    function settingsHTML() { return `<span class="tag">Sistema</span><h2>Ajustes</h2><p>Modo oscuro activo. Próximamente: temas, idioma, rendimiento y perfil.</p>`; }

    setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); }, 1000);
  </script>
</body>
</html>
