<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062b13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jumbo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles/main.css">
<title>Jumbo Launcher Alpha 0.4</title>
</head>
<body>
<main id="home" class="screen launcher active">
<section class="hero">
<div class="logo-wrap"><img src="assets/logo-jumbo.svg" alt="Logo Jumbo"></div>
<span id="versionBadge" class="badge">JUMBO LAUNCHER</span>
<h1>Jumbo</h1>
<p class="slogan">Tu creacion no tiene limites.</p>
<button class="start" onclick="Jumbo.openLauncher()">Entrar al ecosistema</button>
</section>
</main>
<main id="desk" class="screen desktop">
<header class="topbar"><div class="brand"><img src="assets/logo-jumbo.svg" alt="Jumbo"><span>Jumbo Launcher</span></div><span id="clock" class="time">--:--</span></header>
<section id="ecosystem" class="ecosystem"></section>
<section id="window" class="window"><div class="whead"><strong id="wtitle">Jumbo</strong><button onclick="Jumbo.closeWindow()">Cerrar</button></div><div id="wbody" class="wbody"></div></section>
<nav id="dock" class="dock"></nav>
</main>
<section id="appPage" class="page">
<header class="page-head"><button class="back" onclick="Jumbo.closePage()">Volver</button><span id="pageTitle" class="page-title">Jumbo</span></header>
<div id="pageBody" class="page-body"></div>
</section>
<section id="projectView" class="project-view">
<div class="engine-bar"><button onclick="Jumbo.closeProject3D()">← Salir</button><b>Jumbo Engine 3D</b><span>Alpha 0.4</span></div>
<canvas id="jumboCanvas"></canvas>
<div class="engine-help">Toca y arrastra para mover la camara. Pellizca para acercar o alejar.</div>
</section>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
